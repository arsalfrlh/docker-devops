services:

  nginx:
    image: nginx:alpine
    container_name: reverse_proxy_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - laravel
      - fastapi
      - reverb
    networks:
      - app-network


  laravel:
    image: proxy-laravel
    build:
      context: ./laravel
      dockerfile: Dockerfile
    container_name: laravel_app
    command: >
      php artisan octane:start
      --server=frankenphp
      --workers=8
      --max-requests=1000
      --host=0.0.0.0
      --port=8000
    depends_on:
      - redis
      - fastapi
    expose:
      - "8000"
    volumes:
      - ./laravel:/app
    restart: unless-stopped
    networks:
      - app-network


  reverb:
    image: proxy-laravel
    container_name: reverb_websocket
    command: >
      php artisan reverb:start
      --host=0.0.0.0
      --port=8080
    depends_on:
      - redis
    volumes:
      - ./laravel:/app
    expose:
      - "8080"
    networks:
      - app-network


  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: fastapi_ai
    depends_on:
      - redis
    expose:
      - "8000"
    networks:
      - app-network

  redis:
    image: redis:7
    container_name: cache_redis
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network: